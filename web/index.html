<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GlobalCRM —— 现代化智能外贸客户开发、邮件触达与成交管理平台" />
    <meta name="theme-color" content="#1e5b3a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e5b3a'/%3E%3Cpath d='M16 7a9 9 0 1 0 9 9h-7.5' stroke='%23e8d7a8' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <title>GlobalCRM · 智能外贸客户开发与成交管理平台</title>
    <script>
      // 首屏之前先落地主题类，避免深色模式下的白屏闪烁（FOUC）
      (function () {
        try {
          var raw = localStorage.getItem('cdlm-theme');
          var stored = raw ? raw.replace(/^"|"$/g, '') : '';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage 不可用时静默降级为浅色 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
